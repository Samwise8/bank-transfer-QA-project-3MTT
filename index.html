<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Bank Transfer Demo</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}
header{background:#17202a;color:white;padding:18px 24px}
main{max-width:850px;margin:28px auto;padding:0 16px}
.card{background:white;border-radius:12px;padding:22px;box-shadow:0 2px 10px #0001;margin-bottom:18px}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd2d8;border-radius:7px;font-size:15px}
button{margin-top:16px;background:#17202a;color:white;border:0;cursor:pointer}
button.secondary{background:#6c757d}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.balance{font-size:18px;font-weight:700}
.notice{padding:12px;border-radius:7px;margin-top:14px;display:none}
.success{background:#e8f7ee;color:#176b38}.error{background:#fdecec;color:#9d2222}.info{background:#eef4ff;color:#214d8f}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left}
small{color:#667}
</style>
</head>
<body>
<header><strong>TestBank — QA Demonstration Environment</strong></header>
<main>
<div class="card">
<h2>Bank Transfer</h2>
<div class="balance">Available balance: ₦<span id="balance">100,000.00</span></div>
<div class="row">
<div><label>Bank</label><select id="bank"><option>Test Bank</option><option>Demo Commercial Bank</option></select></div>
<div><label>Account Number</label><input id="account" inputmode="numeric" maxlength="10" placeholder="0000000002"></div>
</div>
<label>Amount (₦)</label><input id="amount" type="number" min="0" step="0.01" placeholder="10000">
<label>Narration (optional)</label><input id="narration" maxlength="40" placeholder="QA transfer">
<label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456">
<button id="transfer">Confirm Transfer</button>
<button id="reset" class="secondary">Reset Demo Data</button>
<div id="notice" class="notice"></div>
<small>Demo credentials/data only. This is not a real banking service.</small>
</div>
<div class="card">
<h3>Transaction History</h3>
<table><thead><tr><th>Reference</th><th>Beneficiary</th><th>Amount</th><th>Status</th></tr></thead>
<tbody id="history"><tr><td colspan="4">No transactions</td></tr></tbody></table>
</div>
</main>
<script>
let balance=100000, transactions=[], busy=false, lastRequest="";
const $=id=>document.getElementById(id);
function money(n){return Number(n).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function notice(msg,type){let n=$("notice");n.textContent=msg;n.className="notice "+type;n.style.display="block"}
function render(){ $("balance").textContent=money(balance); let h=$("history"); h.innerHTML=transactions.length?transactions.map(t=>`<tr><td>${t.ref}</td><td>${t.name}</td><td>₦${money(t.amount)}</td><td>${t.status}</td></tr>`).join(""):`<tr><td colspan="4">No transactions</td></tr>`}
function validate(){
 const account=$("account").value.trim(), amount=Number($("amount").value), otp=$("otp").value.trim();
 if(!/^\d{10}$/.test(account)) return "Invalid account number. Enter exactly 10 digits.";
 if(account==="0000000000") return "Beneficiary account could not be found.";
 if(!(amount>0)) return "Transfer amount must be greater than ₦0.";
 if(amount>500000) return "Daily transfer limit exceeded.";
 if(amount>balance) return "Insufficient balance.";
 if(otp!=="123456") return "Invalid or expired OTP.";
 return null;
}
$("transfer").onclick=()=>{
 if(busy){notice("Duplicate request blocked: transaction already processing.","info");return}
 let err=validate(); if(err){notice(err,"error");return}
 busy=true; $("transfer").disabled=true; notice("Processing transaction…","info");
 const amount=Number($("amount").value), account=$("account").value.trim();
 setTimeout(()=>{
   const ref="QA-"+Date.now().toString().slice(-8);
   balance-=amount; transactions.unshift({ref,name:account==="0000000002"?"Test Beneficiary":"Demo Beneficiary",amount,status:"Successful"});
   render(); notice(`Transfer successful. Reference: ${ref}`,"success");
   busy=false; $("transfer").disabled=false;
 },900);
}
$("reset").onclick=()=>{balance=100000;transactions=[];busy=false;$("transfer").disabled=false;["account","amount","narration","otp"].forEach(id=>$(id).value="");notice("Demo data reset.","info");render()}
render();
</script>
</body>
</html>
